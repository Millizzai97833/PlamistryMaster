<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#100b20">
<title>Palmistry Reading Master</title>
<style>
:root{color-scheme:dark;--bg:#0b0914;--panel:#171226;--line:#38294f;--gold:#e9bd70;--muted:#c0b5d0;--text:#f7f0ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29183b,#0b0914 60%);color:var(--text);font:15px system-ui;line-height:1.55}
header{text-align:center;padding:28px 16px 20px;border-bottom:1px solid var(--line)}.brand{color:var(--gold);letter-spacing:3px;text-transform:uppercase;font-size:12px}.hero{font:clamp(30px,6vw,48px) Georgia;margin:8px}.sub{color:var(--muted);max-width:700px;margin:auto}
main{max-width:960px;margin:22px auto;padding:0 14px 45px}.panel{background:#171226ed;border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
h2{font:24px Georgia;color:var(--gold);margin:0 0 12px}h3{font-size:16px;color:#f3d9a8;margin:0 0 8px}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}
select,input[type=file]{width:100%;padding:12px;background:#0e0b18;color:var(--text);border:1px solid #59456f;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hand{padding:12px 5px;border:1px solid #59456f;border-radius:12px;text-align:center;background:#100d1b;cursor:pointer}.hand.active{border-color:var(--gold);background:#392a3d}.hand input{width:auto}
.uploadbox,.linecard{border:1px solid var(--line);border-radius:13px;padding:13px;background:#100d1b}.preview{width:100%;max-height:330px;object-fit:contain;border-radius:10px;margin-top:10px;background:#08070d}.hidden{display:none!important}
button{font:inherit;cursor:pointer}.primary{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:linear-gradient(110deg,#f0cb82,#b57b43);color:#1b1020;font-weight:800}.secondary{padding:10px 14px;border:1px solid #66507f;border-radius:10px;background:#211832;color:var(--text)}
.notice{border-left:3px solid var(--gold);padding:10px 12px;background:#241b2e;color:#ded3eb;border-radius:6px;font-size:13px}.muted,.status{color:var(--muted)}.status{font-size:13px;margin-top:7px;color:var(--gold)}.result{white-space:pre-wrap;background:#100d1b;border:1px solid var(--line);padding:16px;border-radius:12px;margin-top:12px}.footer{text-align:center;color:#91869e;font-size:12px;padding:22px}
@media(max-width:520px){.hands{grid-template-columns:1fr}.panel{padding:14px}}
</style>
</head>
<body>
<header><div class="brand">Shahab Millizai presents</div><div class="hero">Palmistry Reading Master</div><p class="sub" id="tagline"></p></header>
<main>
<section class="panel">
<h2 id="setup"></h2>
<div class="grid">
<div><label id="langLabel" for="language"></label><select id="language"><option value="en">English</option><option value="ur">اردو</option><option value="hi">हिन्दी</option></select></div>
<div><label id="handLabel"></label><div class="hands">
<label class="hand active"><input type="radio" name="hand" value="right" checked> <span id="right"></span></label>
<label class="hand"><input type="radio" name="hand" value="left"> <span id="left"></span></label>
<label class="hand"><input type="radio" name="hand" value="both"> <span id="both"></span></label>
</div></div></div>
<div class="grid" style="margin-top:14px">
<div class="uploadbox" id="rightBox"><h3 id="rightTitle"></h3><label id="rightLabel" for="rightFile"></label><input id="rightFile" type="file" accept="image/*" capture="environment"><img id="rightPreview" class="preview hidden" alt="Right palm preview"><div id="rightStatus" class="status"></div></div>
<div class="uploadbox hidden" id="leftBox"><h3 id="leftTitle"></h3><label id="leftLabel" for="leftFile"></label><input id="leftFile" type="file" accept="image/*" capture="environment"><img id="leftPreview" class="preview hidden" alt="Left palm preview"><div id="leftStatus" class="status"></div></div>
</div>
<p class="notice" id="privacy"></p>
</section>
<section class="panel"><h2 id="linesTitle"></h2><p class="muted" id="linesHelp"></p><div id="lineInputs" class="grid"></div></section>
<section class="panel"><h2 id="reportTitle"></h2><div class="notice" id="honesty"></div><button class="primary" id="generate"></button><div id="quality" class="status"></div><div id="report" class="result hidden" aria-live="polite"></div><div class="grid"><button class="secondary hidden" id="copy"></button><button class="secondary hidden" id="print"></button></div></section>
</main><div class="footer">Palmistry Reading Master · Browser-based · Traditional interpretations are for reflection and entertainment.</div>

"روایتی طور پر تخلیقی صلاحیت اور پہچان سے منسوب ہے۔","روایتی طور پر گفتگو اور کاروباری رجحان سے منسوب ہے۔","روایتی طور پر تعلقات کے موضوعات سے منسوب ہے؛ شادی کی پیش گوئی نہیں کرتی۔"]},
hi:{tag:"अपनी हथेली की दिखाई देने वाली रेखाओं का निजी, मार्गदर्शित पारंपरिक अध्ययन करें।",setup:"रीडिंग की तैयारी",lang:"रीडिंग की भाषा",hand:"आप किस हाथ की हथेली पढ़ना चाहते हैं?",right:"दायाँ हाथ",left:"बायाँ हाथ",both:"दोनों हाथ",rTitle:"दायीं हथेली की तस्वीर",lTitle:"बायीं हथेली की तस्वीर",rLabel:"दायीं हथेली की साफ़ तस्वीर चुनें",lLabel:"बायीं हथेली की साफ़ तस्वीर चुनें",privacy:"आपकी तस्वीरें इसी ब्राउज़र में रहती हैं और सर्वर पर अपलोड नहीं होतीं। अच्छी रोशनी में पूरी हथेली की तस्वीर लें।",lines:"केवल वे रेखाएँ बताएँ जो वास्तव में दिखती हैं",help:"तस्वीर देखकर हर रेखा का सबसे उपयुक्त विवरण चुनें। अस्पष्ट हो तो 'दिखाई नहीं दे रही' चुनें।",honesty:"यह टूल अपने आप रेखाएँ पहचानने या वैज्ञानिक रूप से भविष्य बताने का दावा नहीं करता। यह आपके चुने हुए अवलोकनों को पारंपरिक हस्तरेखा व्याख्याओं से जोड़ता है।",generate:"मेरी रीडिंग बनाएँ",report:"आपकी हस्तरेखा रिपोर्ट",choose:"जो दिखे उसे चुनें",not:"दिखाई नहीं दे रही / पता नहीं",faint:"हल्की या उथली",clear:"स्पष्ट और लगातार",deep:"गहरी और प्रमुख",broken:"टूटी या बाधित",curved:"घुमावदार",straight:"ज़्यादातर सीधी",branched:"शाखाएँ हैं",short:"छोटी",long:"लंबी",read:"पारंपरिक व्याख्या",missing:"पहले चुने गए हाथ की तस्वीर अपलोड करें।",quality:"तस्वीर ब्राउज़र में लोड हो गई है। स्वयं देखकर केवल स्पष्ट रेखाएँ चुनें।",copy:"रिपोर्ट कॉपी करें",print:"प्रिंट / PDF सेव करें",copied:"कॉपी हो गया!",bright:"तस्वीर थोड़ी अंधेरी है; बेहतर रोशनी में लें।",good:"तस्वीर लोड हो गई। रेखाओं की स्वचालित पहचान नहीं होती; स्वयं पुष्टि करें।",disclaimer:"याद रखें: ये सांस्कृतिक मान्यताएँ हैं, वैज्ञानिक भविष्यवाणियाँ नहीं।",names:["हृदय रेखा","मस्तिष्क रेखा","जीवन रेखा","भाग्य रेखा","सूर्य / अपोलो रेखा","बुध रेखा","विवाह / संबंध रेखाएँ"],meanings:["पारंपरिक हस्तरेखा में भावनाओं और स्नेह से जुड़ी मानी जाती है।","सोचने और निर्णय लेने की शैली से जुड़ी मानी जाती है।","ऊर्जा और जीवन के दृष्टिकोण से जुड़ी है; यह उम्र या स्वास्थ्य नहीं बताती।","काम और जीवन में बदलाव से जुड़ी मानी जाती है।","रचनात्मकता और पहचान से जुड़ी मानी जाती है।","संवाद और उद्यम से let lang="en";const $=id=>document.getElementById(id),t=k=>T[lang][k]||T.en[k];
const fields={tagline:"tag",setup:"setup",langLabel:"lang",handLabel:"hand",right:"right",left:"left",both:"both",rightTitle:"rTitle",leftTitle:"lTitle",rightLabel:"rLabel",leftLabel:"lLabel",privacy:"privacy",linesTitle:"lines",linesHelp:"help",honesty:"honesty",generate:"generate",reportTitle:"report",copy:"copy",print:"print"};
function translate(){lang=$("language").value;document.documentElement.lang=lang;for(const [id,key] of Object.entries(fields))$(id).textContent=t(key);drawLines()}
$("language").onchange=translate;
const lineKeys=["heart","head","life","fate","sun","mercury","marriage"],opts=["not","faint","clear","deep","broken","curved","straight","branched","short","long"];
function drawLines(){ $("lineInputs").innerHTML="";const hnd=selectedHand();const sides=hnd==="both"?["right","left"]:[hnd];sides.forEach(side=>{const heading=document.createElement("h3");heading.style.gridColumn="1/-1";heading.textContent=side==="right"?t("right"):t("left");$("lineInputs").append(heading);T[lang].names.forEach((name,i)=>{const box=document.createElement("div");box.className="linecard";const h=document.createElement("h3");h.textContent=name;const label=document.createElement("label");label.textContent=t("choose");const sel=document.createElement("select");sel.id="line_"+side+"_"+lineKeys[i];opts.forEach(v=>{const op=document.createElement("option");op.value=v;op.textContent=t(v);sel.append(op)});box.append(h,label,sel);$("lineInputs").append(box)})})}
function selectedHand(){return document.querySelector('input[name=hand]:checked').value}
function updateHand(){const h=selectedHand();$("rightBox").classList.toggle("hidden",h==="left");$("leftBox").classList.toggle("hidden",h==="right");document.querySelectorAll(".hand").forEach(x=>x.classList.toggle("active",x.querySelector("input").checked));drawLines()}
document.querySelectorAll('input[name=hand]').forEach(x=>x.addEventListener("change",updateHand));
function loadPhoto(side){const file=$(side+"File").files[0];if(!file)return;const url=URL.createObjectURL(file),img=$(side+"Preview");img.onload=()=>{const c=document.createElement("canvas");c.width=60;c.height=60;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,60,60);const data=ctx.getImageData(0,0,60,60).data;let sum=0;for(let i=0;i<data.length;i+=4)sum+=.2126*data[i]+.7152*data[i+1]+.0722*data[i+2];$(side+"Status").textContent=sum/(data.length/4)<65?t("bright"):t("good")};img.src=url;img.classList.remove("hidden")}
["right","left"].forEach(s=>$(s+"File").addEventListener("change",()=>loadPhoto(s)));
function handReport(side){let out=(side==="left"?t("left"):t("right"))+"\\n\\n";let count=0;T[lang].names.forEach((name,i)=>{const v=$("line_"+side+"_"+lineKeys[i]).value;if(v!=="not"){count++;out+="• "+name+": "+t(v)+"\\n"+t("read")+": "+T[lang].meanings[i]+"\\n\\n"}});if(!count)out+=t("not")+"\\n";return out}
$("generate").onclick=()=>{const h=selectedHand();if((h!=="left"&&!$("rightFile").files[0])||(h!=="right"&&!$("leftFile").files[0])){alert(t("missing"));return}let out="PALMISTRY READING MASTER\\n\\n";if(h!=="left")out+=handReport("right")+"\\n";if(h!=="right")out+=handReport("left")+"\\n";out+=t("disclaimer");$("report").textContent=out;$("report").classList.remove("hidden");$("copy").classList.remove("hidden");$("print").classList.remove("hidden");$("quality").textContent=t("quality")};
$("copy").onclick=async()=>{await navigator.clipboard.writeText($("report").textContent);$("copy").textContent=t("copied")};$("print").onclick=()=>window.print();
translate();updateHand();
</script>
</body></html>
